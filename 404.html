<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=/#" />
    <title>Redirecting…</title>
  </head>
  <body>
    <script>
      // GitHub Pages 404 fallback for client-side routing (HashRouter)
      // If the current URL already contains a hash, keep it; otherwise send to root hash
      if (!location.hash) {
        location.replace('/#');
      }
    </script>
    <p>Redirecting…</p>
  </body>
</html>
